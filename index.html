<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Real Flip Pomodoro</title>
  <style>
    /* 全体のリセットと背景設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* タイマーコンテナ（基本は横並び） */
    .timer-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 3vw; 
      transform: translateY(-3vh); 
      transition: all 0.3s ease; /* 縦横の切り替えを少し滑らかに */
    }

    /* フリップユニット本体 */
    .flip-unit {
      position: relative;
      aspect-ratio: 1 / 1; 
      width: min(42vw, 75vh); /* 横画面時の限界サイズ */
      height: auto;
      perspective: 1200px;
      border-radius: 3cqmin; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      background-color: #000;
      container-type: inline-size;
      transition: width 0.3s ease;
    }

    @supports not (border-radius: 3cqmin) {
      .flip-unit { border-radius: 12px; }
      .top { border-radius: 12px 12px 0 0; }
      .bottom { border-radius: 0 0 12px 12px; }
    }

    /* 中央の切れ目 */
    .flip-unit::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: max(4px, 0.8cqmin); 
      background-color: #000000;
      transform: translateY(-50%);
      z-index: 10;
    }

    /* 上半分と下半分の基本スタイル */
    .top, .bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      background-color: #1a1a1a;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .top {
      top: 0;
      border-radius: 3cqmin 3cqmin 0 0;
      transform-origin: bottom;
    }

    .bottom {
      bottom: 0;
      border-radius: 0 0 3cqmin 3cqmin;
      transform-origin: top;
    }

    /* 数字のテキスト設定 */
    .top::after, .bottom::after {
      content: attr(data-val);
      position: absolute;
      left: 0;
      width: 100%;
      height: 200%; 
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 78cqi; 
      font-weight: 700;
      letter-spacing: -2px; 
      color: #f5f5f5;
    }

    @supports not (font-size: 78cqi) {
      .top::after, .bottom::after {
        font-size: clamp(80px, 30vw, 400px);
      }
    }

    .top::after { top: 0; }
    .bottom::after { bottom: 0; }

    /* 立体感を出すためのグラデーションシャドウ */
    .top::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
      z-index: 1;
    }

    /* --- アニメーション用要素 --- */
    .flip-top {
      z-index: 5;
      animation: flipDownTop 0.25s ease-in forwards;
    }

    .flip-bottom {
      z-index: 5;
      transform: rotateX(90deg);
      animation: flipDownBottom 0.25s ease-out 0.25s forwards;
    }

    @keyframes flipDownTop {
      0% { transform: rotateX(0); filter: brightness(1); }
      100% { transform: rotateX(-90deg); filter: brightness(0.3); }
    }

    @keyframes flipDownBottom {
      0% { transform: rotateX(90deg); filter: brightness(0.3); }
      100% { transform: rotateX(0); filter: brightness(1); }
    }

    /* コロン */
    .colon {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: min(20vw, 35vh); 
      font-weight: 700;
      padding-bottom: 2%; 
      color: #1a1a1a;
      text-shadow: 0 0 10px rgba(255,255,255,0.1);
      animation: blink 1s infinite;
    }

    .paused .colon {
      animation: none;
      opacity: 1;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    /* --- 下部コントロールバー --- */
    .bottom-bar {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 10px) + 5px);
      width: 100%;
      padding: 0 calc(env(safe-area-inset-right, 5vw) + 2vw) 0 calc(env(safe-area-inset-left, 5vw) + 2vw);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 20;
    }

    /* モード選択（中央） */
    .modes {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4vw;
    }

    .mode-btn {
      font-size: clamp(14px, 2.5vh, 24px);
      font-weight: 300;
      letter-spacing: 3px;
      color: #333333;
      transition: color 0.4s ease;
      padding: 8px 15px; 
      cursor: pointer;
    }

    .mode-btn.active {
      color: #999999;
    }

    /* フリップトグル（右端） */
    .flip-toggle {
      font-size: clamp(12px, 2vh, 18px);
      font-weight: 300;
      letter-spacing: 2px;
      color: #333333;
      transition: color 0.2s ease;
      padding: 8px 15px;
      cursor: pointer;
    }

    .flip-toggle.flash {
      color: #aaaaaa; 
    }

    /* =========================================
       📱 スマホ縦画面（ポートレート）用の上書き設定
       ========================================= */
    @media (orientation: portrait) {
      .timer-container {
        flex-direction: column; /* 縦並びに変更 */
        gap: 2vh; /* 縦の隙間 */
        transform: translateY(-4vh); /* 縦並びの時の位置微調整 */
      }
      
      .flip-unit {
        /* 縦に2つ並ぶため、幅ではなく「画面の高さの約38%」を限界サイズに設定 */
        width: min(85vw, 38vh); 
      }
      
      .colon {
        display: none; /* 縦並びの時はコロンを非表示にして洗練させる */
      }
      
      .modes {
        gap: 8vw; /* 縦画面だと横幅が狭いので、メニューの隙間を少し広めに */
      }
    }
  </style>
</head>
<body class="paused" id="body" onclick="toggleTimer()">

  <div class="timer-container">
    <div class="flip-unit" id="min-unit">
      <div class="top" data-val="25"></div>
      <div class="bottom" data-val="25"></div>
    </div>
    <div class="colon">:</div>
    <div class="flip-unit" id="sec-unit">
      <div class="top" data-val="00"></div>
      <div class="bottom" data-val="00"></div>
    </div>
  </div>
  
  <div class="bottom-bar">
    <div class="modes">
      <div id="btn-focus" class="mode-btn active" onclick="setMode('focus', event)">FOCUS</div>
      <div id="btn-break" class="mode-btn" onclick="setMode('break', event)">BREAK</div>
    </div>
    <div id="btn-flip" class="flip-toggle" onclick="toggleFlip(event)">FLIP</div>
  </div>

  <script>
    const TIME_FOCUS = 25 * 60;
    const TIME_BREAK = 5 * 60;

    let timeLeft = TIME_FOCUS;
    let isRunning = false;
    let currentMode = 'focus';
    let isFlipEnabled = false; 
    let timerInterval;

    const bodyEl = document.getElementById('body');
    const btnFocus = document.getElementById('btn-focus');
    const btnBreak = document.getElementById('btn-break');
    const btnFlip = document.getElementById('btn-flip');

    function flip(unitId, newNumber) {
      const unit = document.getElementById(unitId);
      const top = unit.querySelector('.top:not(.flip-top)');
      const bottom = unit.querySelector('.bottom:not(.flip-bottom)');
      const currentNumber = top.getAttribute('data-val');
      
      if (currentNumber === newNumber) return;

      unit.querySelectorAll('.flip-top, .flip-bottom').forEach(el => el.remove());

      const flipTop = document.createElement('div');
      flipTop.className = 'top flip-top';
      flipTop.setAttribute('data-val', currentNumber);

      const flipBottom = document.createElement('div');
      flipBottom.className = 'bottom flip-bottom';
      flipBottom.setAttribute('data-val', newNumber);

      unit.appendChild(flipTop);
      unit.appendChild(flipBottom);

      top.setAttribute('data-val', newNumber);

      flipTop.addEventListener('animationend', () => {
        flipTop.remove();
      });

      flipBottom.addEventListener('animationend', () => {
        bottom.setAttribute('data-val', newNumber);
        flipBottom.remove();
      });
    }

    function updateDisplay(forceUpdate = false) {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const s = (timeLeft % 60).toString().padStart(2, '0');

      if (forceUpdate || !isFlipEnabled) {
        ['min-unit', 'sec-unit'].forEach(id => {
          const val = id === 'min-unit' ? m : s;
          const unit = document.getElementById(id);
          
          // アニメーション途中の仮カード（ゴミ）が残っていたら強制的に消す
          unit.querySelectorAll('.flip-top, .flip-bottom').forEach(el => el.remove());
          
          unit.querySelectorAll('.top, .bottom').forEach(el => el.setAttribute('data-val', val));
        });
      } else {
        flip('min-unit', m);
        flip('sec-unit', s);
      }
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        bodyEl.classList.add('paused');
      } else {
        isRunning = true;
        bodyEl.classList.remove('paused');
        
        timerInterval = setInterval(() => {
          timeLeft--;
          updateDisplay();

          if (timeLeft <= 0) {
            const nextMode = currentMode === 'focus' ? 'break' : 'focus';
            setMode(nextMode);
          }
        }, 1000);
      }
    }

    function setMode(mode, event) {
      if (event) event.stopPropagation();

      clearInterval(timerInterval);
      isRunning = false;
      bodyEl.classList.add('paused');
      
      currentMode = mode;
      timeLeft = mode === 'focus' ? TIME_FOCUS : TIME_BREAK;
      
      btnFocus.classList.toggle('active', mode === 'focus');
      btnBreak.classList.toggle('active', mode === 'break');
      
      updateDisplay(true);
    }

    function toggleFlip(event) {
      if (event) event.stopPropagation();
      isFlipEnabled = !isFlipEnabled;
      
      btnFlip.classList.add('flash');
      
      setTimeout(() => {
        btnFlip.classList.remove('flash');
      }, 300);
    }

    updateDisplay(true);
  </script>
</body>
</html>
