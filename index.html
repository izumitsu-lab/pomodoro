<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Beautiful Pomodoro</title>
  <style>
    /* 全体のリセットとベーススタイル */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* 背景アニメーションのキーフレーム */
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      /* Workモードの背景（元デザインを踏襲） */
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #112d38);
      background-size: 300% 300%;
      animation: gradientMove 15s ease infinite;
      
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      
      position: relative;
      z-index: 0;
    }

    /* Breakモードの背景（疑似要素を使ってシームレスにフェードインさせる） */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      /* 夕暮れ時のようなリラックスできる暖色系のグラデーション */
      background: linear-gradient(-45deg, #355C7D, #6C5B7B, #C06C84, #f67280);
      background-size: 300% 300%;
      animation: gradientMove 15s ease infinite;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      z-index: -1;
    }

    /* Breakモード時にBreak用背景を表示 */
    body.break-mode::before {
      opacity: 1;
    }

    /* メインコンテナ（グラスモーフィズム） */
    .glass-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 20px 40px;
      text-align: center;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
      width: 85%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: all 0.5s ease; /* 枠や影の変化を滑らかに */
    }

    /* 残り1分を切った時の警告アニメーション（赤く脈打つ） */
    @keyframes pulseAlert {
      0% { box-shadow: 0 25px 45px rgba(255, 69, 58, 0.1); border-color: rgba(255, 69, 58, 0.2); }
      50% { box-shadow: 0 25px 50px rgba(255, 69, 58, 0.6); border-color: rgba(255, 69, 58, 0.7); }
      100% { box-shadow: 0 25px 45px rgba(255, 69, 58, 0.1); border-color: rgba(255, 69, 58, 0.2); }
    }

    .glass-container.urgent {
      animation: pulseAlert 2s infinite ease-in-out;
    }

    .glass-container.urgent .timer-display {
      color: #ffb3b0; /* タイマーの文字も少し赤みがかる */
      text-shadow: 0 0 15px rgba(255, 69, 58, 0.5);
    }

    /* モード切替ボタン群 */
    .modes {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .mode-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.6);
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }

    /* タイマー表示 */
    .timer-display {
      font-size: 20vmin;
      font-weight: 200;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      line-height: 1;
      margin: 10px 0;
      transition: color 0.5s ease, text-shadow 0.5s ease;
    }

    /* コントロールボタン群 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .control-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.2);
    }

    #startBtn {
      background: rgba(76, 217, 100, 0.2);
      border: 1px solid rgba(76, 217, 100, 0.4);
    }
    
    #pauseBtn {
      background: rgba(255, 204, 0, 0.2);
      border: 1px solid rgba(255, 204, 0, 0.4);
    }

  </style>
</head>
<body>

  <div class="glass-container" id="glassContainer">
    <div class="modes">
      <button class="mode-btn active" id="workMode" onclick="setMode('work')">Work</button>
      <button class="mode-btn" id="breakMode" onclick="setMode('break')">Break</button>
    </div>
    
    <div class="timer-display" id="display">25:00</div>
    
    <div class="controls">
      <button class="control-btn" id="startBtn" onclick="startTimer()">Start</button>
      <button class="control-btn" id="pauseBtn" onclick="pauseTimer()">Pause</button>
      <button class="control-btn" id="resetBtn" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <script>
    // タイマーの設定時間（秒）
    const WORK_TIME = 25 * 60;
    const BREAK_TIME = 5 * 60;

    let timeLeft = WORK_TIME;
    let timerId = null;
    let isRunning = false;
    let currentMode = 'work';

    const displayEl = document.getElementById('display');
    const glassContainerEl = document.getElementById('glassContainer');
    const workBtn = document.getElementById('workMode');
    const breakBtn = document.getElementById('breakMode');

    // 画面の更新と色の演出
    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      displayEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      // 【色の演出】残り1分（60秒）を切ったら警告エフェクトを追加
      if (timeLeft <= 60 && timeLeft > 0) {
        glassContainerEl.classList.add('urgent');
      } else {
        glassContainerEl.classList.remove('urgent');
      }
    }

    // タイマー開始
    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          // 時間切れ時の処理
          clearInterval(timerId);
          isRunning = false;
          glassContainerEl.classList.remove('urgent');
          
          // 自動でモードを切り替える（アラート後に切り替え）
          setTimeout(() => {
            alert("Time's up!");
            setMode(currentMode === 'work' ? 'break' : 'work');
          }, 100);
        }
      }, 1000);
    }

    // タイマー一時停止
    function pauseTimer() {
      if (!isRunning) return;
      clearInterval(timerId);
      isRunning = false;
    }

    // タイマーリセット
    function resetTimer() {
      pauseTimer();
      timeLeft = currentMode === 'work' ? WORK_TIME : BREAK_TIME;
      updateDisplay();
    }

    // モード切替（Work / Break）と背景の切り替え
    function setMode(mode) {
      if (currentMode === mode) return;
      
      currentMode = mode;
      pauseTimer();

      if (mode === 'work') {
        workBtn.classList.add('active');
        breakBtn.classList.remove('active');
        document.body.classList.remove('break-mode');
        timeLeft = WORK_TIME;
      } else {
        breakBtn.classList.add('active');
        workBtn.classList.remove('active');
        document.body.classList.add('break-mode');
        timeLeft = BREAK_TIME;
      }
      updateDisplay();
    }

    // 初期表示のセットアップ
    updateDisplay();
  </script>
</body>
</html>
