<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Beautiful Pomodoro</title>
  <style>
    /* 全体のリセットとベーススタイル */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent; /* タップ時のハイライトを消去 */
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* 深みのあるグラデーション */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      /* iPhoneのセーフエリアを考慮したパディング */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* メインコンテナ（グラスモーフィズム） */
    .glass-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 20px 40px;
      text-align: center;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
      width: 85%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* モード切替ボタン群 */
    .modes {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .mode-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.6);
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }

    /* タイマー表示 */
    .timer-display {
      font-size: 20vmin; /* 画面サイズに応じたダイナミックなフォントサイズ */
      font-weight: 200;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums; /* 数字の幅を等幅にしてガタつきを防ぐ */
      text-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      line-height: 1;
      margin: 10px 0;
    }

    /* コントロールボタン群 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .control-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.2);
    }

    #startBtn {
      background: rgba(76, 217, 100, 0.2); /* 控えめなグリーン */
      border: 1px solid rgba(76, 217, 100, 0.4);
    }
    
    #pauseBtn {
      background: rgba(255, 204, 0, 0.2); /* 控えめなイエロー */
      border: 1px solid rgba(255, 204, 0, 0.4);
    }

  </style>
</head>
<body>

  <div class="glass-container">
    <div class="modes">
      <button class="mode-btn active" id="workMode" onclick="setMode('work')">Work</button>
      <button class="mode-btn" id="breakMode" onclick="setMode('break')">Break</button>
    </div>
    
    <div class="timer-display" id="display">25:00</div>
    
    <div class="controls">
      <button class="control-btn" id="startBtn" onclick="startTimer()">Start</button>
      <button class="control-btn" id="pauseBtn" onclick="pauseTimer()">Pause</button>
      <button class="control-btn" id="resetBtn" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <script>
    // タイマーの設定時間（秒）
    const WORK_TIME = 25 * 60;
    const BREAK_TIME = 5 * 60;

    let timeLeft = WORK_TIME;
    let timerId = null;
    let isRunning = false;
    let currentMode = 'work';

    const displayEl = document.getElementById('display');
    const workBtn = document.getElementById('workMode');
    const breakBtn = document.getElementById('breakMode');

    // 画面の更新
    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      displayEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // タイマー開始
    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          // 時間切れ時の処理
          clearInterval(timerId);
          isRunning = false;
          alert("Time's up!");
        }
      }, 1000);
    }

    // タイマー一時停止
    function pauseTimer() {
      if (!isRunning) return;
      clearInterval(timerId);
      isRunning = false;
    }

    // タイマーリセット
    function resetTimer() {
      pauseTimer();
      timeLeft = currentMode === 'work' ? WORK_TIME : BREAK_TIME;
      updateDisplay();
    }

    // モード切替（Work / Break）
    function setMode(mode) {
      if (currentMode === mode) return;
      
      currentMode = mode;
      pauseTimer();

      if (mode === 'work') {
        workBtn.classList.add('active');
        breakBtn.classList.remove('active');
        timeLeft = WORK_TIME;
      } else {
        breakBtn.classList.add('active');
        workBtn.classList.remove('active');
        timeLeft = BREAK_TIME;
      }
      updateDisplay();
    }

    // 初期表示のセットアップ
    updateDisplay();
  </script>
</body>
</html>
