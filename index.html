<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>Flip Pomodoro</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flip Pomodoro">

  <style>
    /* 全体のリセットと背景設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      /* バグの原因だった touch-action: manipulation; を削除し安全性を確保 */
    }
    
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* タイマーコンテナ */
    .timer-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 3vw; 
      transform: translateY(-3vh); 
      transition: all 0.3s ease; 
    }

    /* フリップユニット本体 */
    .flip-unit {
      position: relative;
      aspect-ratio: 1 / 1; 
      width: min(42vw, 75vh); 
      height: auto;
      perspective: 1200px;
      border-radius: 3cqmin; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      background-color: #000;
      container-type: inline-size;
      transition: width 0.3s ease;
    }

    @supports not (border-radius: 3cqmin) {
      .flip-unit { border-radius: 12px; }
      .top { border-radius: 12px 12px 0 0; }
      .bottom { border-radius: 0 0 12px 12px; }
    }

    /* 中央の切れ目 */
    .flip-unit::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: max(4px, 0.8cqmin); 
      background-color: #000000;
      transform: translateY(-50%);
      z-index: 10;
    }

    /* 上半分と下半分の基本スタイル */
    .top, .bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      background-color: #1a1a1a;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .top {
      top: 0;
      border-radius: 3cqmin 3cqmin 0 0;
      transform-origin: bottom;
    }

    .bottom {
      bottom: 0;
      border-radius: 0 0 3cqmin 3cqmin;
      transform-origin: top;
    }

    /* 数字のテキスト設定 */
    .top::after, .bottom::after {
      content: attr(data-val);
      position: absolute;
      left: 0;
      width: 100%;
      height: 200%; 
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 78cqi; 
      font-weight: 700;
      letter-spacing: -2px; 
      color: #f5f5f5;
    }

    @supports not (font-size: 78cqi) {
      .top::after, .bottom::after {
        font-size: clamp(80px, 30vw, 400px);
      }
    }

    .top::after { top: 0; }
    .bottom::after { bottom: 0; }

    /* 立体感を出すためのグラデーションシャドウ */
    .top::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
      z-index: 1;
    }

    /* --- アニメーション用要素 --- */
    .flip-top {
      z-index: 5;
      animation: flipDownTop 0.25s ease-in forwards;
    }

    .flip-bottom {
      z-index: 5;
      transform: rotateX(90deg);
      animation: flipDownBottom 0.25s ease-out 0.25s forwards;
    }

    @keyframes flipDownTop {
      0% { transform: rotateX(0); filter: brightness(1); }
      100% { transform: rotateX(-90deg); filter: brightness(0.3); }
    }

    @keyframes flipDownBottom {
      0% { transform: rotateX(90deg); filter: brightness(0.3); }
      100% { transform: rotateX(0); filter: brightness(1); }
    }

    /* コロン */
    .colon {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: min(20vw, 35vh); 
      font-weight: 700;
      padding-bottom: 2%; 
      color: #1a1a1a;
      text-shadow: 0 0 10px rgba(255,255,255,0.1);
      animation: blink 1s infinite;
    }

    .paused .colon {
      animation: none;
      opacity: 1;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    /* --- 下部コントロールバー --- */
    .bottom-bar {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 10px) + 5px);
      width: 100%;
      padding: 0 calc(env(safe-area-inset-right, 5vw) + 2vw) 0 calc(env(safe-area-inset-left, 5vw) + 2vw);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 20;
    }

    /* モード選択（中央に絶対配置） */
    .modes {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4vw;
    }

    .mode-btn {
      font-size: clamp(14px, 2.5vh, 24px);
      font-weight: 300;
      letter-spacing: 3px;
      color: #333333;
      transition: color 0.4s ease;
      padding: 8px 15px; 
      cursor: pointer;
    }

    .mode-btn.active {
      color: #999999;
    }

    /* 右側の設定トグル群 */
    .toggles {
      display: flex;
      gap: 1vw;
    }

    .setting-toggle {
      font-size: clamp(12px, 2vh, 18px);
      font-weight: 300;
      letter-spacing: 2px;
      color: #333333;
      transition: color 0.3s ease;
      padding: 8px 10px;
      cursor: pointer;
      min-width: 80px; 
      text-align: center;
    }

    .setting-toggle.flash {
      color: #e0e0e0; 
    }

    /* =========================================
       📱 スマホ縦画面（ポートレート）用の上書き設定
       ========================================= */
    @media (orientation: portrait) {
      .timer-container {
        flex-direction: column; 
        gap: 2vh; 
        transform: translateY(-8vh); 
      }
      .flip-unit {
        width: min(80vw, 30vh); 
      }
      .colon {
        display: none; 
      }
      
      .bottom-bar {
        justify-content: center;
        bottom: calc(env(safe-area-inset-bottom, 20px) + 5vh);
      }
      
      .modes {
        position: relative;
        left: 0;
        transform: none;
        gap: 10vw; 
      }
      
      .toggles {
        display: none;
      }
    }
  </style>
</head>
<body class="paused" id="body">

  <div class="timer-container">
    <div class="flip-unit" id="min-unit">
      <div class="top" data-val="25"></div>
      <div class="bottom" data-val="25"></div>
    </div>
    <div class="colon">:</div>
    <div class="flip-unit" id="sec-unit">
      <div class="top" data-val="00"></div>
      <div class="bottom" data-val="00"></div>
    </div>
  </div>
  
  <div class="bottom-bar">
    <div class="modes">
      <div id="btn-focus" class="mode-btn active">FOCUS</div>
      <div id="btn-break" class="mode-btn">BREAK</div>
    </div>
    <div class="toggles">
      <div id="btn-sound" class="setting-toggle">SOUND</div>
      <div id="btn-flip" class="setting-toggle">FLIP</div>
    </div>
  </div>

  <script>
    const TIME_FOCUS = 25 * 60;
    const TIME_BREAK = 5 * 60;

    let timeLeft = TIME_FOCUS;
    let isRunning = false;
    let currentMode = 'focus';
    
    // デフォルト設定 (SOUND OFF, FLIP ON)
    let isFlipEnabled = true; 
    let isSoundEnabled = false; 
    
    let timerInterval;
    let audioCtx; 
    let flipTimeoutId;
    let soundTimeoutId;

    const bodyEl = document.getElementById('body');
    const btnFocus = document.getElementById('btn-focus');
    const btnBreak = document.getElementById('btn-break');
    const btnFlip = document.getElementById('btn-flip');
    const btnSound = document.getElementById('btn-sound');

    // エレガントなベルの音（安全装置付き）
    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.error("Audio init error:", e);
      }
    }

    function playElegantChime() {
      if (!isSoundEnabled || !audioCtx) return;
      try {
        const t = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.value = 880; 

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.value = 1760; 

        gain1.gain.setValueAtTime(0, t);
        gain1.gain.linearRampToValueAtTime(0.5, t + 0.05); 
        gain1.gain.exponentialRampToValueAtTime(0.001, t + 3); 

        gain2.gain.setValueAtTime(0, t);
        gain2.gain.linearRampToValueAtTime(0.15, t + 0.05);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 2);

        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);

        osc1.start(t);
        osc1.stop(t + 3);
        osc2.start(t);
        osc2.stop(t + 2);
      } catch (e) {
        console.error("Audio play error:", e);
      }
    }

    function flip(unitId, newNumber) {
      const unit = document.getElementById(unitId);
      if (!unit) return;
      const top = unit.querySelector('.top:not(.flip-top)');
      const bottom = unit.querySelector('.bottom:not(.flip-bottom)');
      if (!top || !bottom) return;
      
      const currentNumber = top.getAttribute('data-val');
      if (currentNumber === newNumber) return;

      unit.querySelectorAll('.flip-top, .flip-bottom').forEach(el => el.remove());

      const flipTop = document.createElement('div');
      flipTop.className = 'top flip-top';
      flipTop.setAttribute('data-val', currentNumber);

      const flipBottom = document.createElement('div');
      flipBottom.className = 'bottom flip-bottom';
      flipBottom.setAttribute('data-val', newNumber);

      unit.appendChild(flipTop);
      unit.appendChild(flipBottom);

      top.setAttribute('data-val', newNumber);

      flipTop.addEventListener('animationend', () => {
        flipTop.remove();
      });

      flipBottom.addEventListener('animationend', () => {
        bottom.setAttribute('data-val', newNumber);
        flipBottom.remove();
      });
    }

    function updateDisplay(forceUpdate = false) {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const s = (timeLeft % 60).toString().padStart(2, '0');

      if (forceUpdate || !isFlipEnabled) {
        ['min-unit', 'sec-unit'].forEach(id => {
          const val = id === 'min-unit' ? m : s;
          const unit = document.getElementById(id);
          if (unit) {
            unit.querySelectorAll('.flip-top, .flip-bottom').forEach(el => el.remove());
            unit.querySelectorAll('.top, .bottom').forEach(el => el.setAttribute('data-val', val));
          }
        });
      } else {
        flip('min-unit', m);
        flip('sec-unit', s);
      }
    }

    function toggleTimer() {
      initAudio();

      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        bodyEl.classList.add('paused');
      } else {
        isRunning = true;
        bodyEl.classList.remove('paused');
        
        timerInterval = setInterval(() => {
          timeLeft--;
          updateDisplay();

          if (timeLeft <= 0) {
            playElegantChime(); 
            const nextMode = currentMode === 'focus' ? 'break' : 'focus';
            setMode(nextMode);
          }
        }, 1000);
      }
    }

    function setMode(mode) {
      clearInterval(timerInterval);
      isRunning = false;
      bodyEl.classList.add('paused');
      
      currentMode = mode;
      timeLeft = mode === 'focus' ? TIME_FOCUS : TIME_BREAK;
      
      btnFocus.classList.toggle('active', mode === 'focus');
      btnBreak.classList.toggle('active', mode === 'break');
      
      updateDisplay(true);
    }

    function toggleFlip() {
      isFlipEnabled = !isFlipEnabled;
      
      btnFlip.textContent = isFlipEnabled ? "FLIP: ON" : "FLIP: OFF";
      btnFlip.classList.add('flash');
      
      clearTimeout(flipTimeoutId);
      flipTimeoutId = setTimeout(() => {
        btnFlip.classList.remove('flash');
        btnFlip.textContent = "FLIP";
      }, 1500);
    }

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      
      btnSound.textContent = isSoundEnabled ? "SOUND: ON" : "SOUND: OFF";
      btnSound.classList.add('flash');
      
      clearTimeout(soundTimeoutId);
      soundTimeoutId = setTimeout(() => {
        btnSound.classList.remove('flash');
        btnSound.textContent = "SOUND";
      }, 1500);
      
      if(isSoundEnabled) {
        initAudio();
        playElegantChime();
      }
    }

    // --- 100%確実なイベントリスナーの登録（iOSバグ対策） ---
    btnFocus.addEventListener('click', function(e) {
      e.stopPropagation();
      setMode('focus');
    });

    btnBreak.addEventListener('click', function(e) {
      e.stopPropagation();
      setMode('break');
    });

    btnFlip.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleFlip();
    });

    btnSound.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleSound();
    });

    // 画面のどこかをタップした時にタイマーを作動させる
    document.body.addEventListener('click', function(e) {
      // 下部のコントロールバーをタップした時はタイマーを反応させない
      if (e.target.closest('.bottom-bar')) return;
      toggleTimer();
    });

    // 初期表示
    updateDisplay(true);
  </script>
</body>
</html>
